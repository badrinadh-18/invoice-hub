<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/app-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>InvoiceHub — Multi-User Bill Management System</title>
  <meta name="description"
    content="Secure, modern invoice and billing management platform for businesses and freelancers." />
  <!-- Google Fonts: Inter loaded non-blocking for instant first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <!-- Google Identity Services for Google Sign-In & Account Chooser -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    try {
      var t = localStorage.getItem('invoicehub_theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  </script>
</head>

<body class="bg-slate-50 text-slate-900 antialiased font-sans" style="-webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
